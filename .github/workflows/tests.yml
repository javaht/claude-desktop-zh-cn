name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile patcher
        run: |
          python3 -m py_compile scripts/patch_claude_zh_cn.py
          python3 -m py_compile scripts/patch_linux_asar.py

      - name: Syntax-check Linux installer
        run: |
          bash -n install-linux.sh
          bash -n scripts/install_linux.sh

      - name: Validate resource JSON files
        run: |
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path
          for path in sorted(Path("resources").glob("*.json")):
              raw = path.read_text(encoding="utf-8")
              keys = re.findall(r'^  "((?:[^"\\]|\\.)+)":', raw, re.M)
              dupes = {k for k in keys if keys.count(k) > 1}
              if dupes:
                  sys.exit(f"{path}: duplicate keys {dupes}")
              json.loads(raw)
          print("All resource JSON files are valid with no duplicate keys.")
          PY
